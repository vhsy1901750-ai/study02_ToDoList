<!doctype html>
<!-- 2026-10-02 12:46 KST -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="desktop.css">
  <script src="src/ui-prefs.js"></script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main class="app desktop">
    <header class="app-header">
      <h1>할 일</h1>
      <div class="toggles">
        <button id="layout-toggle" type="button" class="toggle-button">1단으로 보기</button>
        <button id="theme-toggle" type="button" class="toggle-button">다크 모드</button>
      </div>
    </header>
    <p id="notice" class="notice" role="alert" hidden></p>
    <div class="layout">
      <aside class="sidebar">
        <section class="progress" aria-label="진행률">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <p id="progress-text" class="progress-text"></p>
        </section>
        <nav id="tabs" class="tabs" aria-label="카테고리"></nav>
      </aside>
      <section class="content" aria-label="할 일 목록">
        <form id="add-form" class="add-form">
          <input id="add-title" name="title" type="text" maxlength="100" placeholder="할 일을 입력하세요" aria-label="할 일 제목" autocomplete="off">
          <select id="add-category" name="category" aria-label="카테고리"></select>
          <button type="submit">추가</button>
        </form>
        <ul id="todo-list" class="todo-list"></ul>
        <button id="clear-completed" type="button" class="clear-completed">완료 항목 정리</button>
      </section>
    </div>
  </main>
</body>
</html>
